name: Check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install: true
          install_args: node
          cache: true

      - name: Enable Corepack
        run: npm install -g corepack

      - run: yarn install --immutable
      - run: yarn biome ci
      - run: yarn validate
