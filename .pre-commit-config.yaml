repos:
  - repo: local
    hooks:
      - id: local-biome-check
        name: biome check
        entry: yarn biome check --write --files-ignore-unknown=true --no-errors-on-unmatched
        language: system
        types: [text]
        files: "\\.(json|ya?ml|md)$"

      - id: local-renovate-config-validator
        name: renovate config validator
        entry: yarn renovate-config-validator --strict --no-global
        language: system
        files: "^[^/]+\\.json$"
        exclude: "^(biome|package)\\.json$"
